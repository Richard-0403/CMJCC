services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: jobrec
      POSTGRES_PASSWORD: jobrec
      POSTGRES_DB: jobrec
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobrec"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://jobrec:jobrec@postgres:5432/jobrec
      JOBREC_CONFIG: configs/experiment_full.yaml
      JOBREC_CATALOG: data/processed/jobs.jsonl
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../artifacts:/app/artifacts
      - ../configs:/app/configs

volumes:
  pgdata:
