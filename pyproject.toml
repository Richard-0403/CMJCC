[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobrec-cmjcc"
version = "0.1.0"
description = "Agent-Oriented Conversational Job Recommendation research prototype with the Candidate-Memory and Job-Context Connector (CMJCC)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Research Prototype" }]
dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "structlog>=24.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100,<7",
    "coverage>=7.4",
    # Linter and type checker are pinned to exact versions for the thesis freeze: both
    # back a CI gate (`ruff check`, and the mypy error-count ceiling MYPY_MAX_ERRORS in
    # .github/workflows/ci.yml). With an open range a newly released ruff/mypy can add
    # rules or infer more precisely and flip the gate's verdict on unchanged code, so the
    # archived artifact would no longer reproduce its own CI result. Bump deliberately.
    "ruff==0.16.0",
    "mypy==2.3.0",
]
eval = [
    "pandas>=2.1",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.scripts]
jobrec = "jobrec.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

# The annotation web UI ships its own templates and static assets (no node/npm build step, so
# these files ARE the front end). Without this they would be missing from a built wheel.
[tool.setuptools.package-data]
"jobrec_eval.annotation_ui" = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"
pythonpath = ["."]
markers = [
    "p0_2_gate: entry criterion for P0-2 (multi-turn state and evidence provenance). Fails today by design; excluded from the default run via -m 'not p0_2_gate' and run with `python scripts/preflight.py --only p0-2-gate`. Drop the marker once green.",
    "postgres: tests that require a reachable PostgreSQL database",
    "perf: latency measurements across catalog sizes (R28); excluded from the default run via -m 'not perf', run with `make test-perf`",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
# 3.12 is the lowest version mypy can actually check this project at: the installed numpy
# stubs use PEP 695 `type` statements, which mypy only parses for 3.12+, so pinning 3.11
# made mypy abort on numpy/__init__.pyi before checking a single project file. This is the
# single source of truth: CI no longer duplicates it as `--python-version 3.12`, so a plain
# `mypy src` (and `make typecheck`) is exactly the CI gate. Runtime support floor
# stays `requires-python = ">=3.11"` and ruff still targets py311.
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
