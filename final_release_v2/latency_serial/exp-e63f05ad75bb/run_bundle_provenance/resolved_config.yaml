project:
  name: jobrec-cmjcc
  environment: local
  reference_date: '2026-01-01'
experiment:
  variant: full
  random_seed: 42
  top_k: 5
  retrieval_pool_size: 50
  repeat_count: 1
  max_dialogue_turns: 6
memory:
  enabled: true
  use_prior_dialogue: true
  use_multi_turn_continuation: true
  persist_confirmed_updates: true
  inference_to_long_term: false
  clarification_confidence_threshold: 0.72
context:
  explicit_constraint_orchestration: true
  hard_constraint_unknown_default: fail
  expired_job_policy: fail
retrieval:
  provider: hybrid
  lexical_weight: 0.45
  semantic_weight: 0.35
  structured_weight: 0.2
ranking:
  missing_feature_policy: renormalize
  weights:
    role_match: 0.25
    required_skill_match: 0.25
    preferred_skill_match: 0.1
    location_preference: 0.1
    work_mode_preference: 0.1
    salary_preference: 0.1
    experience_fit: 0.07
    industry_preference: 0.03
  salary_scale: 4000.0
llm:
  mode: hybrid
  provider: remote
  extraction_temperature: 0.0
  response_temperature: 0.2
  timeout_seconds: 90
  max_retries: 4
  retry_backoff_seconds:
  - 2.0
  - 5.0
  - 10.0
  - 20.0
  save_raw_responses: true
logging:
  level: INFO
  format: json
  redact_candidate_text: false
