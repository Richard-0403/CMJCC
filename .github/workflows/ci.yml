name: CI

# R29 — CI gate. Every check below runs on pushes and pull requests, and the
# aggregate `gate` job is what the `release` job depends on: a release for a
# tag is only published when unit tests, lint, type-check, coverage, the
# deterministic smoke evaluation and the data-quality/catalog validation all
# pass (R29.1/R29.2).
#
# Dependency note: `jobrec_eval` imports pandas at module level, so the test,
# type-check, data-quality and smoke-eval jobs install the `eval` extra as well
# as `dev`. The extras stay separated (pandas/scipy/matplotlib are analysis-only
# and are not needed to run the recommender itself) - CI simply installs both.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint + secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Every gate below calls scripts/preflight.py, which is also what `make gate-local`
      # runs. The commands are defined there and nowhere else, so a green local gate and a
      # green CI gate mean the same thing. Previously each was spelled out twice, and they
      # had already diverged: this job linted src+tests+scripts while the Makefile linted
      # src+tests only.
      - name: Lint (ruff)
        run: python scripts/preflight.py --only lint

      - name: Secret scan (no committed keys)
        run: |
          ! grep -RInE "(api[_-]?key|secret|password)\s*[:=]\s*['\"][A-Za-z0-9]{16,}" src configs scripts || \
            (echo "Potential secret committed" && exit 1)

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      # `python_version = "3.12"` lives in [tool.mypy] in pyproject.toml (required
      # because the installed numpy stubs use PEP 695 `type` statements, which mypy
      # only parses for 3.12+; without it mypy aborts before checking any project
      # file). It used to be repeated as `--python-version 3.12` here; the flag was
      # dropped so there is a single source of truth and `mypy src` locally is
      # byte-for-byte the command CI runs.
      #
      # mypy is pinned to an exact version in the `dev` extra so this gate is
      # reproducible: an unpinned checker changes the verdict on unchanged code
      # whenever a new release infers more precisely.
      #
      # The ratchet used to be an inline shell block here, which is why the Makefile
      # could get away with `mypy src || true`: there was nothing shared to disagree
      # with. It now lives in scripts/mypy_ratchet.py, which owns the ceiling (14
      # pre-existing annotation errors, identical on Linux and Windows) and separates
      # "mypy could not complete" from "more errors than the ceiling". Lower
      # DEFAULT_MAX_ERRORS there as errors are fixed; do not set MYPY_MAX_ERRORS here,
      # or the ceiling would have two sources again.
      - name: Type check (mypy ratchet)
        run: python scripts/preflight.py --only typecheck

  tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      # Postgres-backed tests need a database; perf tests (R28) are latency
      # measurements and are excluded to keep the gate fast.
      - name: Tests (deterministic) + coverage
        run: python scripts/preflight.py --only tests

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-artifacts
          path: |
            artifacts/
            .coverage
          if-no-files-found: ignore

  data-quality:
    name: Data quality + catalog validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Prepare data
        run: |
          cp data/processed/catalog_manifest.json committed_catalog_manifest.json
          python scripts/generate_raw_catalog.py --output data/raw/jobs.csv --count 200
          python scripts/prepare_catalog.py --input data/raw/jobs.csv --out-dir data/processed

      # The generator is seeded, so a regenerated catalog must reproduce the
      # catalog_hash recorded in the committed manifest.
      - name: Catalog snapshot is reproducible
        run: |
          python -c "import json, pathlib, sys; h = lambda p: json.loads(pathlib.Path(p).read_text())['catalog_hash']; a = h('data/processed/catalog_manifest.json'); b = h('committed_catalog_manifest.json'); print('catalog_hash', a); sys.exit(0 if a == b else 'catalog_hash drifted: regenerated %s != committed %s' % (a, b))"

      # scripts/validate_catalog.py keeps the schema check and, with
      # --scenarios/--config, delegates the R17 data-quality checks to
      # jobrec_eval.cli run_validate, which exits non-zero on any
      # error-severity finding.
      - name: Validate catalog + scenarios (data quality)
        run: |
          mkdir -p artifacts
          python scripts/preflight.py --only data-quality

      # The authoritative scenario set carries the 42 declared references the canonical
      # oracle is a pure function of, and scripts/build_eval_scenarios.py emits no
      # reference block -- so this asserts the file is intact AND that the builder still
      # refuses to write it.
      - name: Authoritative scenarios are intact
        run: python scripts/preflight.py --only scenarios

      - name: Upload data-quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-report
          path: artifacts/
          if-no-files-found: ignore

  smoke-eval:
    name: Deterministic smoke evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Prepare data
        run: |
          python scripts/generate_raw_catalog.py --output data/raw/jobs.csv --count 200
          python scripts/prepare_catalog.py --input data/raw/jobs.csv --out-dir data/processed

      # Tiny fixture (scenario subset), three variants, one repeat, reduced
      # bootstrap: the mock/deterministic LLM provider means no secret and no
      # network call is required.
      - name: Smoke evaluation (full,no_memory,no_context x1)
        run: |
          python -m jobrec_eval.cli pipeline \
            --config configs/experiment_full.yaml \
            --scenarios evaluation/data/scenarios_subset.jsonl \
            --catalog data/processed/jobs.jsonl \
            --out-root artifacts/ci-smoke \
            --variants full,no_memory,no_context \
            --repeats 1 \
            --bootstrap-iters 200

      - name: Verify smoke artifacts against their checksum manifest
        run: |
          shopt -s nullglob
          dirs=(artifacts/ci-smoke/exp-*)
          if [ ${#dirs[@]} -eq 0 ]; then
            echo "::error::the smoke evaluation produced no output bundle"
            exit 1
          fi
          for d in "${dirs[@]}"; do
            python -m jobrec_eval.cli verify "$d"
          done

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-eval-artifacts
          path: artifacts/ci-smoke/
          if-no-files-found: ignore

  # Single aggregate status: fails when any gate job failed or was cancelled.
  # `release` depends on this job, so a red gate blocks the release (R29.2).
  gate:
    name: CI gate
    if: always()
    needs: [lint, typecheck, tests, data-quality, smoke-eval]
    runs-on: ubuntu-latest
    steps:
      - name: Block on any failed check
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::one or more CI checks failed - release tagging is blocked"
          exit 1

      - name: Gate passed
        run: echo "lint, type-check, tests, coverage, data quality and smoke eval all passed"

  # Runs only for v* tags and only after the gate is green, so tagging a release
  # cannot produce a published release unless every check passed (R29.2).
  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish the release for the tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
